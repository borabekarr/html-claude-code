<!-- @dsCard group="Merge - navigation-layout" name="BottomToolbar" subtitle="-> new: Navigation & layout" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/_base.css">

<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif; }
  body, button, input, select, textarea { font-family: 'Montserrat', system-ui, sans-serif; }
  h1, h2, h3, h4 { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 900; }
  .material-icons { font-family: 'Material Icons'; }
  .material-symbols-outlined, .ms { font-family: 'Material Symbols Outlined'; }
  a { color: #059669; text-decoration: none; }
  a:hover { color: #047857; text-decoration: underline; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; line-height: 1; }
  .bt-action { border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; }
  .bt-action::after { content: ""; position: absolute; inset: 50% auto auto 50%; width: 44px; height: 44px; transform: translate(-50%,-50%); }
  .bt-action:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
  .bt-action:active { transform: scale(0.97); transition: transform var(--duration-fast) var(--ease-press-calm); }
  @media (hover: hover) and (pointer: fine) {
    .bt-action-dark { transition: background var(--duration-base) var(--ease-standard); }
    .bt-action-dark:hover { background: rgba(255,255,255,0.20); }
    .bt-action-icon { transition: background var(--duration-base) var(--ease-standard); }
    .bt-action-icon:hover { background: var(--gray-200); }
    .bt-action-delete:hover { filter: brightness(1.08); }
    .bt-action-cta:hover { filter: brightness(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bt-action, .bt-action-dark, .bt-action-icon, .bt-action-delete, .bt-action-cta { transition-duration: 0.01ms !important; } /* motion-sweep: kept */
  }
</style>
<link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script></helmet>

<div style="padding: var(--space-10) var(--space-12) 64px; display: flex; flex-direction: column; gap: var(--space-6); color: #0F172A;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: var(--type-mini); font-weight: var(--weight-bold); letter-spacing: 0.12em; text-transform: uppercase; color: #94A3B8;">Bora · Navigation</div>
    <h1 style="margin: 0; font-size: var(--type-h1); font-weight: var(--weight-black); letter-spacing: -0.02em;">BottomToolbar</h1>
    <p style="margin: 0; font-size: var(--type-body-sm); font-weight: var(--weight-medium); color: #64748B;">Contextual actions for a multi-row selection.</p>
  </div>

  <div style="box-sizing: border-box; background: #0F172A; border-radius: var(--radius-circle); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); padding: 10px var(--space-3) 10px var(--space-5); display: inline-flex; align-items: center; gap: 18px; align-self: flex-start;">
    <span style="font-size: var(--type-body-sm); font-weight: var(--weight-bold); color: #FFFFFF;">3 selected</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <button type="button" class="bt-action bt-action-dark" style="height: 34px; padding: 0 14px; border-radius: var(--radius-circle); background: rgba(255,255,255,0.12); color: #FFFFFF; font-size: var(--type-meta); font-weight: var(--weight-bold); display: flex; align-items: center; gap: 6px; font-family: inherit;"><span class="ms" style="font-size: 17px;">swap_horiz</span>Move</button>
      <button type="button" class="bt-action bt-action-dark" style="height: 34px; padding: 0 14px; border-radius: var(--radius-circle); background: rgba(255,255,255,0.12); color: #FFFFFF; font-size: var(--type-meta); font-weight: var(--weight-bold); display: flex; align-items: center; gap: 6px; font-family: inherit;"><span class="ms" style="font-size: 17px;">person_add</span>Assign</button>
      <button type="button" class="bt-action bt-action-delete" style="height: 34px; padding: 0 14px; border-radius: var(--radius-circle); background: #EF4444; color: #FFFFFF; font-size: var(--type-meta); font-weight: var(--weight-extrabold); display: flex; align-items: center; gap: 6px; font-family: inherit;"><span class="ms" style="font-size: 17px;">delete</span>Delete</button>
    </div>
  </div>

  <div style="box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: var(--radius-circle); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -1px rgba(0,0,0,0.06); padding: 10px var(--space-3) 10px var(--space-5); display: inline-flex; align-items: center; gap: 18px; align-self: flex-start;">
    <span style="font-size: var(--type-body-sm); font-weight: var(--weight-bold); color: #0F172A;">Pipeline</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <button type="button" class="ms bt-action bt-action-icon" style="width: 34px; height: 34px; border-radius: var(--radius-circle); background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #475569; font-family: inherit;">filter_list</button>
      <button type="button" class="ms bt-action bt-action-icon" style="width: 34px; height: 34px; border-radius: var(--radius-circle); background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #475569; font-family: inherit;">sort</button>
      <button type="button" class="ms bt-action bt-action-icon" style="width: 34px; height: 34px; border-radius: var(--radius-circle); background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #475569; font-family: inherit;">download</button>
      <button type="button" class="bt-action bt-action-cta" style="height: 34px; padding: 0 var(--space-4); border-radius: var(--radius-circle); background: #10B981; color: #FFFFFF; font-size: var(--type-meta); font-weight: var(--weight-extrabold); display: flex; align-items: center; gap: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 8px -1px rgba(16,185,129,0.6); font-family: inherit;"><span class="ms" style="font-size: 17px;">add</span>New lead</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
