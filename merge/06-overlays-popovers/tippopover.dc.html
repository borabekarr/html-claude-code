<!-- @dsCard group="Merge - overlays-popovers" name="TipPopover" subtitle="-> new: Overlays & popovers" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/_base.css">

<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif; }
  body, button, input, select, textarea { font-family: 'Montserrat', system-ui, sans-serif; }
  h1, h2, h3, h4 { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 900; }
  .material-icons { font-family: 'Material Icons'; }
  .material-symbols-outlined, .ms { font-family: 'Material Symbols Outlined'; }
  a { color: #059669; text-decoration: none; }
  a:hover { color: #047857; text-decoration: underline; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; line-height: 1; }
</style>
<link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script></helmet>

<div style="padding: var(--space-10) var(--space-12) 64px; display: flex; flex-direction: column; gap: 28px; color: #0F172A;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94A3B8;">Bora · Overlays</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em;">TipPopover</h1>
    <p style="margin: 0; font-size: 13px; font-weight: 500; color: #64748B;">Onboarding hint. Arrow top-left, and a compact tooltip form.</p>
  </div>

  <div role="tooltip" style="width: 320px; box-sizing: border-box; position: relative; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -1px rgba(0,0,0,0.06); padding: 18px; display: flex; gap: 14px; margin-top: var(--space-2);">
    <span style="position: absolute; top: -7px; left: var(--space-10); width: 12px; height: 12px; background: #FFFFFF; border-left: 1px solid #E2E8F0; border-top: 1px solid #E2E8F0; transform: rotate(45deg);"></span>
    <div style="width: 36px; height: 36px; border-radius: 10px; background: var(--brand-primary-50); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><span class="ms" style="font-size: 20px; color: var(--brand-primary-600);">lightbulb</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 14px; font-weight: 700;">Drag to reprioritise</span>
      <span style="font-size: 12px; font-weight: 500; color: #64748B; line-height: 1.5;">Cards can be dragged between columns. Order inside a column sets follow-up sequence.</span>
      <span style="font-size: 12px; font-weight: 800; color: var(--brand-primary-600); margin-top: 2px;">Got it</span>
    </div>
  </div>

  <div style="display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap;">
    <div role="tooltip" style="position: relative; padding: var(--space-2) 14px; border-radius: 10px; background: #0F172A; font-size: 12px; font-weight: 600; color: #FFFFFF;">
      Sync runs hourly
      <span style="position: absolute; bottom: -5px; left: 18px; width: 10px; height: 10px; background: #0F172A; transform: rotate(45deg);"></span>
    </div>
    <div role="tooltip" style="position: relative; padding: var(--space-2) 14px; border-radius: 10px; background: var(--brand-primary); font-size: 12px; font-weight: 700; color: #FFFFFF; box-shadow: 0 2px 8px -1px rgba(16,185,129,0.6);">
      3 new leads assigned
      <span style="position: absolute; bottom: -5px; left: 18px; width: 10px; height: 10px; background: var(--brand-primary); transform: rotate(45deg);"></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
