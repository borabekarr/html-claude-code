<!-- @dsCard group="Merge - cards" name="MainBox" subtitle="-> Cards" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/_base.css">
<link rel="stylesheet" href="../../preview/_darkmode.css">
<link rel="stylesheet" href="../../preview/done/jsx/_buttons.css">
<link rel="stylesheet" href="../../preview/done/jsx/_pills.css">
<link rel="stylesheet" href="../../preview/done/jsx/_cards.css">
<link rel="stylesheet" href="../../preview/done/jsx/_iconography.css">
<link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script>

<style>
  body { background: var(--shell-bg, #D4DCE8); }
  @keyframes mbRise { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes mbFlip { from { opacity: 0; transform: translateY(-70%); } to { opacity: 1; transform: none; } }
  @keyframes mbSweep { from { left: -140px; } to { left: 100%; } }
  @keyframes mbPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes mbSpin { to { transform: rotate(360deg); } }
  @keyframes mbGlow { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.9; } }
  .mb-shell { zoom: 0.78; animation: mbRise calc(var(--duration-560) * var(--anim-mult, 1)) var(--ease-out) both; }
  .mb-sweep { animation: mbSweep calc(3600ms * var(--anim-mult, 1)) linear infinite; } /* motion-sweep: kept -- no DS tier at this duration */
  .mb-digit { display: inline-block; animation: mbFlip calc(var(--duration-260) * var(--anim-mult, 1)) var(--ease-out); }
  .mb-live { animation: mbPulse calc(1400ms * var(--anim-mult, 1)) ease-in-out infinite; } /* motion-sweep: kept -- no DS tier at this duration */
  .mb-spin { animation: mbSpin calc(var(--duration-700) * var(--anim-mult, 1)) linear infinite; }
  .mb-halo { animation: mbGlow calc(5200ms * var(--anim-mult, 1)) ease-in-out infinite; } /* motion-sweep: kept -- no DS tier at this duration */
  @media (prefers-reduced-motion: reduce) {
    .mb-shell, .mb-sweep, .mb-digit, .mb-live, .mb-spin, .mb-halo { animation: none !important; }
  }
  /* .mb-shell renders at zoom: 0.78, shrinking .btn-cta's DS-defined 46px
     height to ~36px on screen; compensate the hit layer for the zoom so the
     effective tap target is still 44px post-zoom (44 / 0.78 ~= 57px). */
  .mb-cta-hit44::after { content: ""; position: absolute; inset: 50% auto auto 50%; width: 57px; height: 57px; transform: translate(-50%,-50%); }
</style>
</helmet>

<div style="min-height: 100%; padding: 40px 24px 56px; display: flex; flex-direction: column; align-items: center; font-family: var(--font-display); background: var(--shell-bg, #D4DCE8);">

  <div class="mb-shell" style="width: 100%; max-width: 920px; box-sizing: border-box; border-radius: 42px; background: #020617; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 20px rgba(2,6,23,0.45); padding: 10px; display: flex;">
  <div style="flex: 1; min-width: 0; position: relative; overflow: hidden; border-radius: 32px; padding: 34px 36px 36px; background-color: #0F172A; background-image: linear-gradient(135deg, rgba(11,42,36,0.55) 0%, rgba(15,23,42,0.62) 48%, rgba(15,23,42,0.62) 100%), radial-gradient(rgba(255,255,255,0.20) 1.3px, transparent 1.4px); background-size: auto, 26px 26px; box-shadow: 0 24px 60px -24px rgba(15,23,42,0.65), inset 0 1px 0 rgba(255,255,255,0.10), inset 0 0 0 1px rgba(255,255,255,0.07);">

    <div class="mb-halo" aria-hidden="true" style="position: absolute; top: -140px; left: -80px; width: 420px; height: 420px; border-radius: var(--radius-circle); background: radial-gradient(circle, rgba(16,185,129,0.30) 0%, transparent 62%); pointer-events: none;"></div>
    <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;">
      <div class="mb-sweep" style="position: absolute; top: 0; bottom: 0; left: -140px; width: 140px; transform: skewX(-14deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);"></div>
    </div>

    <div style="position: relative; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 18px; min-width: 0;">

        <div style="display: inline-flex; align-items: center; gap: var(--space-3); align-self: flex-start; padding: 5px 14px 5px 6px; border-radius: var(--radius-circle); background: rgba(2,6,23,0.72); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09);">
          <span class="badge danger" style="padding: 4px 10px; letter-spacing: 0.01em;">Discount expires in</span>
          <span style="display: inline-flex; align-items: baseline; gap: 7px; color: #F1F5F9; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;">
            <span><span class="mb-digit" key="{{ hh }}">{{ hh }}</span><span style="color: var(--fg4); font-weight: 600; font-size: 12px; margin-left: 3px;">h</span></span>
            <span><span class="mb-digit" key="{{ mm }}">{{ mm }}</span><span style="color: var(--fg4); font-weight: 600; font-size: 12px; margin-left: 3px;">m</span></span>
            <span><span class="mb-digit" key="{{ ss }}">{{ ss }}</span><span style="color: var(--fg4); font-weight: 600; font-size: 12px; margin-left: 3px;">s</span></span>
          </span>
        </div>

        <h2 style="margin: 0; font-size: 40px; line-height: 1.05; font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase; text-wrap: balance;">
          <span style="color: #6EE7B7; display: block;">11-day unlimited access</span>
          <span style="color: #E2E8F0; display: block;">with special 55% off</span>
        </h2>

        <p style="margin: 0; max-width: 42ch; color: #94A3B8; font-size: 15px; font-weight: 500; line-height: 1.55; text-wrap: pretty;">4 days of Unlimited Workspace 2.0 in 4K, then get 7 extra days on Unlimited Workspace 2.5.</p>

        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 6px;">
          <button type="button" class="btn-cta mb-cta-hit44" onClick="{{ onCta }}" style="--accent: #10B981; --ctaglow: rgba(16,185,129,0.45); min-width: 268px; justify-content: center; padding: 15px 26px; border-radius: var(--radius-lg); font-size: 15px; font-weight: 800; color: #04231A; border: none;">
            <sc-if value="{{ ctaIdle }}" hint-placeholder-val="{{ true }}">
              <span style="display: inline-flex; align-items: center; gap: 8px;">
                <span class="material-icons" style="font-size: 19px;">bolt</span>Get Unlimited Workspace 2.0
              </span>
            </sc-if>
            <sc-if value="{{ ctaLoading }}">
              <span style="display: inline-flex; align-items: center; gap: 10px;">
                <span class="mb-spin" style="width: 17px; height: 17px; border-radius: var(--radius-circle); border: 2.5px solid rgba(4,35,26,0.28); border-top-color: #04231A; display: inline-block;"></span>Securing your discount
              </span>
            </sc-if>
            <sc-if value="{{ ctaDone }}">
              <span style="display: inline-flex; align-items: center; gap: 8px;">
                <span class="material-icons" style="font-size: 20px;">check_circle</span>Discount applied
              </span>
            </sc-if>
          </button>
          <span class="mb-live" style="display: inline-flex; align-items: center; gap: 7px; color: #CBD5E1; font-size: 12px; font-weight: 700;">
            <span style="width: 7px; height: 7px; border-radius: var(--radius-circle); background: #10B981; display: inline-block;"></span>412 seats left
          </span>
        </div>
      </div>

      <div style="position: relative; display: grid; place-items: center; min-height: 210px;">
        <div style="position: absolute; width: 210px; height: 210px; border-radius: var(--radius-circle); background: radial-gradient(circle, rgba(110,231,183,0.22) 0%, transparent 65%);"></div>
        <div style="position: relative; padding: 26px 34px; border-radius: var(--radius-xl); background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 0 0 1px rgba(255,255,255,0.12), 0 18px 40px -18px rgba(16,185,129,0.55); transform: rotate(-6deg);">
          <span style="display: block; font-size: 62px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; background: linear-gradient(180deg, #ECFDF5 12%, #6EE7B7 55%, #10B981 100%); -webkit-background-clip: text; background-clip: text; color: transparent;">4K</span>
        </div>
      </div>
    </div>
  </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:320}}">
class Component extends DCLogic {
  state = { remain: 8103, cta: 'idle' };

  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState(s => ({ remain: s.remain > 0 ? s.remain - 1 : 0 }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.ctaT); }

  pad(n) { return String(n).padStart(2, '0'); }

  onCta = () => {
    if (this.state.cta !== 'idle') return;
    this.setState({ cta: 'loading' });
    this.ctaT = setTimeout(() => {
      this.setState({ cta: 'done' });
      this.ctaT = setTimeout(() => this.setState({ cta: 'idle' }), 2600);
    }, 1400);
  };

  renderVals() {
    const r = this.state.remain, c = this.state.cta;
    return {
      hh: this.pad(Math.floor(r / 3600)),
      mm: this.pad(Math.floor(r / 60) % 60),
      ss: this.pad(r % 60),
      ctaIdle: c === 'idle', ctaLoading: c === 'loading', ctaDone: c === 'done',
      onCta: this.onCta,
    };
  }
}

</script>
</body>
</html>
