<!-- @dsCard group="Merge - controls-inputs" name="Scrollbar" subtitle="-> Controls (+ Multisteps, Dynamic Calendar)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/_base.css">

<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif; }
  body, button, input, select, textarea { font-family: 'Montserrat', system-ui, sans-serif; }
  h1, h2, h3, h4 { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 900; }
  .material-icons { font-family: 'Material Icons'; }
  .material-symbols-outlined, .ms { font-family: 'Material Symbols Outlined'; }
  a { color: #059669; text-decoration: none; }
  a:hover { color: #047857; text-decoration: underline; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; line-height: 1; }
</style>
<link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script></helmet>

<div style="padding: var(--space-10) var(--space-12) 64px; display: flex; flex-direction: column; gap: var(--space-6); color: #0F172A;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94A3B8;">Bora · Controls</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em;">Scrollbar</h1>
    <p style="margin: 0; font-size: 13px; font-weight: 500; color: #64748B;">Vertical and horizontal tracks, at rest and while dragging.</p>
  </div>

  <div style="width: 380px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: var(--radius-lg); box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); padding: 22px; display: flex; gap: var(--space-6); align-items: flex-start;">
    <div style="display: flex; gap: var(--space-3);">
      <div style="width: 12px; height: 160px; border-radius: var(--radius-circle); background: #F1F5F9; padding: 2px; box-sizing: border-box;">
        <div style="width: 8px; height: 64px; border-radius: var(--radius-circle); background: #CBD5E1;"></div>
      </div>
      <div style="width: 12px; height: 160px; border-radius: var(--radius-circle); background: #F1F5F9; padding: 2px; box-sizing: border-box; display: flex; align-items: center;">
        <div style="width: 8px; height: 80px; border-radius: var(--radius-circle); background: #94A3B8;"></div>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 14px;">
      <div style="height: var(--space-3); border-radius: var(--radius-circle); background: #F1F5F9; padding: 2px; box-sizing: border-box;">
        <div style="width: 64px; height: 8px; border-radius: var(--radius-circle); background: #CBD5E1;"></div>
      </div>
      <div style="height: var(--space-3); border-radius: var(--radius-circle); background: #F1F5F9; padding: 2px; box-sizing: border-box;">
        <div style="width: 110px; height: 8px; border-radius: var(--radius-circle); background: #94A3B8;"></div>
      </div>
      <div style="height: 6px; border-radius: var(--radius-circle); background: transparent; padding: 1px; box-sizing: border-box;">
        <div style="width: 90px; height: 4px; border-radius: var(--radius-circle); background: rgba(148,163,184,0.5);"></div>
      </div>
      <span style="font-size: 11px; font-weight: 500; color: #94A3B8;">Overlay track — fades in on scroll</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
