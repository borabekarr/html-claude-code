<!-- @dsCard group="Merge - controls-inputs" name="PasswordStrength - PasswordMeter" subtitle="-> Controls (+ Multisteps, Dynamic Calendar)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/_base.css">
<link rel="stylesheet" href="../../preview/_shared-feedback.css">
<link rel="stylesheet" href="../../preview/done/jsx/_pills.css">
<link rel="stylesheet" href="../../preview/done/jsx/_cards.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css"></helmet>
<div style="width:100%;font-family:'Montserrat',sans-serif">
  <div role="meter" aria-label="Password strength" style="{{ trackGrid }}">
    <sc-for list="{{ cells }}" as="cell" hint-placeholder-count="4">
      <div style="position:relative;height:6px;overflow:hidden;border-radius:3px;background:#E2E8F0;box-shadow:inset 0 1px 2px rgba(15,23,42,0.10)">
        <span style="{{ cell.fill }}"></span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;height:22px">
    <span style="display:inline-grid">
      <sc-for list="{{ labels }}" as="lab" hint-placeholder-count="5">
        <span style="{{ lab.style }}">{{ lab.text }}</span>
      </sc-for>
    </span>
    <span style="{{ guessStyle }}">
      <span class="material-icons" style="font-size:13px">error_outline</span>
      Commonly guessed
    </span>
  </div>

  <sc-if value="{{ showRules }}" hint-placeholder-val="{{ true }}">
    <ul style="margin:12px 0 0;padding:0;list-style:none;display:grid;gap:7px">
      <sc-for list="{{ rules }}" as="rule" hint-placeholder-count="4">
        <li style="display:flex;align-items:center;gap:9px">
          <span style="{{ rule.boxStyle }}">
            <span class="material-icons" style="{{ rule.iconStyle }}">check</span>
          </span>
          <span style="{{ rule.textStyle }}">{{ rule.label }}</span>
        </li>
      </sc-for>
    </ul>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:200},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Correct-horse7&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ruleset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;strict&quot;,&quot;pin&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default' | 'strict' | 'pin'&quot;},&quot;showRules&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SYMBOL = /[!-/:-@[-`{-~]/;
const COMMON = /^(?:password|passw0rd|qwerty|letmein|welcome|admin|iloveyou|monkey|dragon|abc123|111111|123123|123456)/i;
const RUN = /(.)\1{3,}/;
const RUN_UP = /(?:0123|1234|2345|3456|4567|5678|6789|abcd|bcde|cdef|defg|qwer|wert|erty|asdf)/i;

const RULESETS = {
  default: [
    { id: 'length', label: '12 characters or more', test: v => v.length >= 12 },
    { id: 'case', label: 'Upper and lower case', test: v => /[a-z]/.test(v) && /[A-Z]/.test(v) },
    { id: 'digit', label: 'A number', test: v => /\d/.test(v) },
    { id: 'symbol', label: 'A symbol', test: v => SYMBOL.test(v) }
  ],
  strict: [
    { id: 'length', label: '16 characters or more', test: v => v.length >= 16 },
    { id: 'case', label: 'Upper and lower case', test: v => /[a-z]/.test(v) && /[A-Z]/.test(v) },
    { id: 'digit', label: 'Two numbers', test: v => (v.match(/\d/g) || []).length >= 2 },
    { id: 'symbol', label: 'A symbol', test: v => SYMBOL.test(v) },
    { id: 'nospace', label: 'No leading or trailing space', test: v => v.length > 0 && v.trim() === v }
  ],
  pin: [
    { id: 'length', label: '6 digits', test: v => v.length >= 6 },
    { id: 'digits', label: 'Numbers only', test: v => v.length > 0 && /^\d+$/.test(v) },
    { id: 'norun', label: 'No repeated or sequential run', test: v => v.length > 0 && !RUN.test(v) && !RUN_UP.test(v) }
  ]
};

const TONES = {
  none: { bar: '#CBD5E1', text: 'var(--fg3, #64748B)' },
  danger: { bar: '#EF4444', text: '#DC2626' },
  caution: { bar: '#EAB308', text: '#A16207' },
  safe: { bar: '#10B981', text: '#059669' }
};

class Component extends DCLogic {
  renderVals() {
    const value = this.props.value ?? '';
    const rules = RULESETS[this.props.ruleset ?? 'default'] ?? RULESETS.default;
    const labels = this.props.ruleset === 'pin'
      ? ['Empty', 'Weak', 'Fair', 'Strong']
      : this.props.ruleset === 'strict'
        ? ['Empty', 'Weak', 'Fair', 'Good', 'Strong', 'Excellent']
        : ['Empty', 'Weak', 'Fair', 'Good', 'Strong'];

    const evaluated = rules.map(r => ({ ...r, met: r.test(value) }));
    const passed = evaluated.reduce((n, r) => n + (r.met ? 1 : 0), 0);
    const guessable = value.length > 0 && (COMMON.test(value) || RUN.test(value) || RUN_UP.test(value));
    const max = rules.length;
    const score = value.length === 0 ? 0 : guessable ? 1 : Math.min(max, Math.max(1, passed));

    const ratio = score / max;
    const tone = score === 0 ? TONES.none : ratio <= 0.34 ? TONES.danger : ratio <= 0.67 ? TONES.caution : TONES.safe;

    const cells = Array.from({ length: max }, (_, i) => ({
      fill: {
        position: 'absolute', inset: 0, borderRadius: '3px', transformOrigin: 'left',
        background: tone.bar,
        backgroundImage: 'linear-gradient(rgba(255,255,255,0.20) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.20) 1px, transparent 1px)',
        backgroundSize: '7px 7px',
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1.5px 0 rgba(15,23,42,0.16)',
        transform: i < score ? 'scaleX(1)' : 'scaleX(0)',
        transitionProperty: 'transform, background-color',
        transitionDuration: '340ms, 200ms',
        transitionTimingFunction: 'cubic-bezier(.34,1.35,.64,1), linear',
        transitionDelay: (i < score ? i * 45 : 0) + 'ms, 0ms'
      }
    }));

    const activeIdx = Math.min(score, labels.length - 1);
    const labelVals = labels.map((text, i) => ({
      text,
      style: {
        gridColumnStart: 1, gridRowStart: 1, whiteSpace: 'nowrap',
        fontSize: '12.5px', fontWeight: 800, lineHeight: '20px', letterSpacing: '0.01em',
        color: tone.text,
        opacity: i === activeIdx ? 1 : 0,
        transform: i === activeIdx ? 'translateY(0)' : 'translateY(3px)',
        transition: 'opacity 260ms cubic-bezier(.22,1,.36,1), transform 260ms cubic-bezier(.22,1,.36,1), color 200ms'
      }
    }));

    const ruleVals = evaluated.map(r => ({
      label: r.label,
      boxStyle: {
        display: 'grid', placeItems: 'center', width: '16px', height: '16px', flexShrink: 0,
        borderRadius: '5px',
        border: r.met ? '1px solid transparent' : '1px solid #CBD5E1',
        background: r.met ? '#10B981' : '#FFFFFF',
        boxShadow: r.met
          ? 'inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1.5px 0 rgba(15,23,42,0.18), 0 2px 6px -2px rgba(16,185,129,0.7)'
          : 'inset 0 -2px 4px rgba(15,23,42,0.06)',
        transition: 'background 220ms cubic-bezier(.22,1,.36,1), box-shadow 220ms, border-color 220ms'
      },
      iconStyle: {
        fontSize: '12px', color: '#fff', fontWeight: 900,
        opacity: r.met ? 1 : 0,
        transform: r.met ? 'scale(1)' : 'scale(0.5)',
        transition: 'opacity 200ms, transform 300ms cubic-bezier(.34,1.5,.64,1)'
      },
      textStyle: {
        fontSize: '12.5px', lineHeight: '20px',
        fontWeight: r.met ? 700 : 600,
        color: r.met ? 'var(--fg2, #334155)' : 'var(--fg3, #64748B)',
        transition: 'color 200ms'
      }
    }));

    return {
      cells, rules: ruleVals, labels: labelVals,
      showRules: this.props.showRules ?? true,
      trackGrid: { display: 'grid', gap: '6px', gridTemplateColumns: 'repeat(' + max + ', minmax(0, 1fr))' },
      guessStyle: {
        display: 'inline-flex', alignItems: 'center', gap: '4px', whiteSpace: 'nowrap',
        padding: '2px 8px', borderRadius: '9999px',
        background: 'var(--semantic-warning-bg, #FEFCE8)', border: '1px solid rgba(234,179,8,0.35)',
        color: '#A16207', fontSize: '11px', fontWeight: 800,
        opacity: guessable ? 1 : 0,
        transform: guessable ? 'translateY(0) scale(1)' : 'translateY(2px) scale(0.96)',
        transition: 'opacity 240ms cubic-bezier(.22,1,.36,1), transform 240ms cubic-bezier(.22,1,.36,1)',
        pointerEvents: 'none'
      }
    };
  }
}
</script>
</body>
</html>
