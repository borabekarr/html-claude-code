                <div style="{{ s.bodyStyle }}">

const DUR = 6000;

class Component extends DCLogic {
  state = { vertical: "Real Estate", active: 0, progress: 0, auto: true, held: false };

  componentDidMount() {
    this.timer = setInterval(() => {
      const auto = this.props.autoplay ?? true;
      if (!auto || !this.state.auto || this.state.held) return;
      this.setState(s => {
        const p = s.progress + 60 / ((this.props.stepDuration ?? DUR));
        if (p >= 1) {
          const n = (s.active + 1) % DATA[s.vertical].steps.length;
          return { active: n, progress: 0 };
        }
        return { progress: p };
      });
    }, 60);
  }
  componentWillUnmount() { clearInterval(this.timer); }

  go(i) { this.setState({ active: i, progress: 0 }); }

  renderVals() {
    const accent = this.props.accentColor ?? "#10B981";
    const v = DATA[this.state.vertical] || DATA["Real Estate"];
    const steps = v.steps;
    const active = Math.min(this.state.active, steps.length - 1);
    const cur = steps[active];
    const autoOn = (this.props.autoplay ?? true) && this.state.auto;

    const verticals = Object.keys(DATA).map(name => {
      const on = name === this.state.vertical;
      return {
        label: name,
        icon: DATA[name].icon,
        select: () => this.setState({ vertical: name, active: 0, progress: 0 }),
        style: {
          display: "inline-flex", alignItems: "center", gap: "7px",
          padding: "10px 16px", cursor: "pointer",
          borderRadius: "var(--radius-pill)",
          border: "1px solid " + (on ? "transparent" : "var(--border-hairline)"),
          fontFamily: "var(--font-display)",
          fontSize: "var(--type-body-sm)",
          fontWeight: on ? 800 : 600,
          letterSpacing: on ? "-0.01em" : "0",
          color: on ? "#fff" : "var(--fg3)",
          background: on ? accent : "var(--bg-card-solid)",
          backgroundImage: on ? "linear-gradient(to right, rgba(255,255,255,0.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.07) 1px, transparent 1px)" : "none",
          backgroundSize: "14px 14px",
          textShadow: on ? "0 1px 2px rgba(0,0,0,0.18)" : "none",
          boxShadow: on
            ? "var(--shadow-emerald-glow-sm), inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -2px 0 rgba(0,0,0,0.22), inset 0 0 0 1px rgba(255,255,255,0.15)"
            : "var(--shadow-glass-sm)",
          transition: "background var(--duration-260) var(--ease-out), color var(--duration-200), box-shadow var(--duration-260), transform var(--duration-base), border-color var(--duration-200)"
        }
      };
    });

    const stepVals = steps.map((s, i) => {
      const on = i === active;
      const done = i < active;
      return {
        num: String(i + 1), title: s.title, body: s.body, chip: s.chip, tags: s.tags,
        done, showNum: !done,
        select: () => this.go(i),
        hold: () => this.setState({ held: true }),
        release: () => this.setState({ held: false }),
        icon: s.icon,
        iconColor: done ? "#10B981" : on ? accent : "#94A3B8",
        shellStyle: {
          boxSizing: "border-box", borderRadius: "42px", background: "#F1F5F9",
          border: "1px solid #E2E8F0", boxShadow: "0 4px 8px rgba(15,23,42,0.10)",
          padding: "10px", display: "flex"
        },
        cardStyle: {
          position: "relative", overflow: "hidden", cursor: "pointer", flex: 1, minWidth: 0,
          padding: on ? "18px 22px 20px" : "18px 22px",
          borderRadius: "32px",
          background: "#FFFFFF",
          border: "1px solid " + (on ? accent : "#E2E8F0"),
          boxShadow: on
            ? "0 10px 28px -8px rgba(15,23,42,0.28), 0 3px 8px -2px rgba(15,23,42,0.12), 0 0 0 3px rgba(16,185,129,0.12)"
            : "0 10px 28px -8px rgba(15,23,42,0.28), 0 3px 8px -2px rgba(15,23,42,0.12), inset 0 0 0 1px rgba(15,23,42,0.03)",
          transition: "border-color var(--duration-240) var(--ease-out), box-shadow var(--duration-240), padding var(--duration-240)"
        },
        numStyle: {
          flex: "0 0 auto", width: "36px", height: "36px", borderRadius: "var(--radius-circle)",
          display: "grid", placeItems: "center",
          fontSize: "var(--type-body-sm)", fontWeight: 900,
          color: on || done ? "#fff" : "var(--fg4)",
          background: done ? "#10B981" : on ? accent : "var(--bg-chip)",
          border: "1px solid " + (on || done ? "transparent" : "var(--border-hairline)"),
          textShadow: on || done ? "0 1px 2px rgba(0,0,0,0.18)" : "none",
          boxShadow: on
            ? "var(--shadow-emerald-glow-sm), inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -2px 0 rgba(0,0,0,0.22)"
            : done ? "inset 0 1px 0 rgba(255,255,255,0.4)" : "var(--shadow-recessed)",
          transition: "background var(--duration-240), color var(--duration-240), box-shadow var(--duration-240), border-color var(--duration-240)"

        chipStyle: {

          height: "26px", padding: "0 13px", borderRadius: "100px",

          opacity: on ? 1 : 0,
          overflow: "hidden",
          transition: "grid-template-rows var(--duration-320) var(--ease-out), opacity var(--duration-240)"
        },
        trackStyle: {
          position: "absolute", left: 0, right: 0, bottom: 0, height: "3px",
          background: "var(--bg-chip)", boxShadow: "var(--shadow-recessed)",
          opacity: on && autoOn ? 1 : 0, transition: "opacity var(--duration-200)"
        },
        fillStyle: {
          height: "100%", width: (on ? this.state.progress * 100 : 0) + "%",
          background: accent, borderRadius: "0 3px 3px 0",
          transition: "width var(--duration-instant) linear"
        }
      };
    });

    const h = React.createElement;
    const panel = h("div", { key: this.state.vertical + active, className: "hiw-panel", style: { position: "relative", display: "flex", flexDirection: "column", gap: "20px", animation: "hiw-in var(--duration-380) var(--ease-out) both" } },
      h("div", null,
        h("div", { style: { fontSize: "48px", fontWeight: 900, lineHeight: 1, letterSpacing: "-0.02em", color: "#fff" } }, cur.metric),
        h("div", { style: { marginTop: "10px", display: "flex", alignItems: "center", gap: "10px" } },
          h("span", { style: { fontSize: "var(--type-micro)", fontWeight: 700, letterSpacing: "var(--tracking-wider)", color: "rgba(255,255,255,0.75)" } }, cur.metricLabel),
          h("span", { style: { display: "inline-flex", alignItems: "center", gap: "4px", padding: "3px 8px", borderRadius: "9999px", background: "rgba(255,255,255,0.2)", border: "1px solid rgba(255,255,255,0.3)", fontSize: "var(--type-mini)", fontWeight: 700, color: "#fff" } },
            h("span", { className: "material-icons", style: { fontSize: "12px" } }, "trending_up"), cur.delta)
        )
      ),
      h("div", { style: { display: "flex", alignItems: "flex-end", gap: "8px", height: "150px", padding: "16px", borderRadius: "var(--radius-lg)", background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.2)" } },
        cur.bars.map((b, i) => h("div", { key: i, className: "hiw-bar", style: { flex: 1, height: b + "%", borderRadius: "6px 6px 3px 3px", background: i === cur.bars.length - 1 ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.4)", transition: "height var(--duration-420) var(--ease-out) calc(var(--duration-40) * " + i + ")" } }))
      ),
      h("div", { style: { display: "flex", gap: "8px" } },
        cur.tags.map(t => h("span", { key: t, style: { padding: "5px 10px", borderRadius: "var(--radius-sm)", background: "rgba(0,0,0,0.2)", border: "1px solid rgba(255,255,255,0.2)", fontSize: "var(--type-mini)", fontWeight: 700, color: "#fff" } }, t))
      )
    );

    return {
      verticals, steps: stepVals, panel,
      headline: v.headline, subcopy: v.subcopy,
      panelKicker: cur.kicker, panelTiming: cur.timing, panelNote: cur.note, panelIcon: cur.icon,
      ctaLabel: this.props.ctaLabel ?? "Get Started",
      next: () => this.go((active + 1) % steps.length),
      toggleAuto: () => this.setState(s => ({ auto: !s.auto, progress: 0 })),
      autoIcon: autoOn ? "pause" : "play_arrow",
      autoLabel: autoOn ? "Pause tour" : "Play tour",
      autoBtnStyle: {
        display: "inline-flex", alignItems: "center", gap: "6px",
        padding: "12px 16px", borderRadius: "var(--radius-lg)",
        background: "var(--card-bg)", border: "1px solid var(--card-border)",
        color: "var(--fg2)", fontFamily: "var(--font-display)",
        fontSize: "var(--type-body)", fontWeight: 700, cursor: "pointer",
        boxShadow: "var(--shadow-glass-sm)",
        transition: "background var(--duration-200), color var(--duration-200)"
      }
    };
  }
}

</script>
</body>
</html>
