<!-- @dsCard group="Merge - ai-chat" name="MessageComposer" subtitle="-> AI Message Box / AI Caveat (new AI Chat section)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/_base.css">

<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif; }
  body, button, input, select, textarea { font-family: 'Montserrat', system-ui, sans-serif; }
  h1, h2, h3, h4 { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 900; }
  .material-icons { font-family: 'Material Icons'; }
  .material-symbols-outlined, .ms { font-family: 'Material Symbols Outlined'; }
  a { color: #059669; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) {
    a:hover { color: #047857; text-decoration: underline; }
  }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; line-height: 1; }
  .mc-btn{ position:relative; border:none; background:transparent; padding:0; margin:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .mc-btn::after{ content:""; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%); }
  .mc-btn:focus-visible{ outline:2px solid var(--brand-primary, #10B981); outline-offset:2px; border-radius:9999px; }
  .mc-send{ border-radius:9999px; }
</style>
<link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script></helmet>

<div style="padding: 40px 48px 64px; display: flex; flex-direction: column; gap: 24px; color: #0F172A;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94A3B8;">Bora · Messaging</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em;">MessageComposer</h1>
    <p style="margin: 0; font-size: 13px; font-weight: 500; color: #64748B;">Bottom input with attach, dictation and send.</p>
  </div>

  <div style="width: 424px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 9999px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -1px rgba(0,0,0,0.06); padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 12px;">
    <button type="button" class="mc-btn" aria-label="Attach"><span class="ms" style="font-size: 22px; color: #64748B;">add_circle</span></button>
    <span style="flex: 1; font-size: 13px; font-weight: 500; color: #94A3B8;">Message Acme Nordics</span>
    <button type="button" class="mc-btn" aria-label="Dictate"><span class="ms" style="font-size: 22px; color: #64748B;">mic</span></button>
    <button type="button" class="mc-btn mc-send" aria-label="Send" style="width: 40px; height: 40px; background: #10B981; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 8px -1px rgba(16,185,129,0.6);"><span class="ms" style="font-size: 20px; color: #FFFFFF;">arrow_upward</span></button>
  </div>

  <div style="width: 424px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #10B981; border-radius: 24px; box-shadow: 0 0 0 3px rgba(16,185,129,0.12), 0 4px 6px -1px rgba(0,0,0,0.10); padding: 14px 8px 8px 16px; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 13px; font-weight: 500; color: #0F172A; line-height: 1.5; padding-right: 8px;">Confirming Thursday at 10:00 for the CFO walkthrough. I'll bring the revised</span>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button type="button" class="mc-btn" aria-label="Attach"><span class="ms" style="font-size: 22px; color: #64748B;">add_circle</span></button>
      <button type="button" class="mc-btn" aria-label="Emoji"><span class="ms" style="font-size: 22px; color: #64748B;">mood</span></button>
      <button type="button" class="mc-btn mc-send" aria-label="Send" style="margin-left: auto; width: 40px; height: 40px; background: #10B981; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 8px -1px rgba(16,185,129,0.6);"><span class="ms" style="font-size: 20px; color: #FFFFFF;">arrow_upward</span></button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
