<style>
  body { margin: 0; background: #F8FAFC; }
  a { color: var(--brand-primary-600); text-decoration: none; }
  a:hover { color: var(--brand-primary-700); }
  @keyframes apIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes apDraw { to { stroke-dashoffset: 0; } }
  @keyframes apSpin { to { transform: rotate(360deg); } }
  @keyframes apRise { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .ap-item { animation: apIn calc(var(--duration-420) * var(--anim-mult, 1)) var(--ease-out) both; }
  .ap-item { border: 0 solid var(--border-hairline); }
  .ap-item + .ap-item { border-top-width: 1px; border-radius: 0 0 12px 12px; }
  .ap-item:has(+ .ap-item) { border-radius: 12px 12px 0 0; }
  .ap-item:nth-child(1) { animation-delay: calc(40ms * var(--anim-mult, 1)); } /* motion-sweep: kept */
  .ap-item:nth-child(2) { animation-delay: calc(110ms * var(--anim-mult, 1)); } /* motion-sweep: kept */
  .ap-item:nth-child(3) { animation-delay: calc(var(--duration-180) * var(--anim-mult, 1)); }
  .ap-item:nth-child(4) { animation-delay: calc(250ms * var(--anim-mult, 1)); } /* motion-sweep: kept */
  .ap-item:nth-child(5) { animation-delay: calc(var(--duration-320) * var(--anim-mult, 1)); }
  .ap-item:nth-child(6) { animation-delay: calc(390ms * var(--anim-mult, 1)); } /* motion-sweep: kept */
  .ap-item.is-off .ap-txt { color: var(--fg4); }
  .ap-item .ap-ic { transition: transform calc(var(--duration-slow) * var(--anim-mult,1)) var(--ease-spring), color calc(var(--duration-200) * var(--anim-mult,1)); }
  .ap-item.is-off .ap-ic { color: #CBD5E1; }
  .ap-item.is-on .ap-ic { animation: apPop calc(var(--duration-320) * var(--anim-mult,1)) var(--ease-spring) both; }
  @keyframes apPop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .mb-btn.is-active { background: #F1F5F9; border-color: #94A3B8; }
  html.dark .mb-btn.is-active { background: #0F172A; border-color: #64748B; }
  .ap-footer { animation: apRise calc(380ms * var(--anim-mult,1)) var(--ease-out) both; } /* motion-sweep: kept */
  .ap-spin { animation: apSpin calc(800ms * var(--anim-mult,1)) linear infinite; } /* motion-sweep: kept */
  .ap-check-draw path { stroke-dasharray: 28; stroke-dashoffset: 28; animation: apDraw calc(var(--duration-420) * var(--anim-mult,1)) calc(80ms * var(--anim-mult,1)) var(--ease-draw) forwards; } /* motion-sweep: kept */

  /* 44px hit layers (DS rule): .pill-tab/.mb-btn/.mb-send are locked
     data-ds classes whose real box is under 44px in this component's
     usage; adding position:relative + a centered ::after hit target here
     (new selectors, no edits inside the locked <style data-ds =...>
     blocks) satisfies the probe's hit-under-44 check without resizing
     the visible control. */
  .pill-tab, .mb-btn, .mb-send, button[aria-label="Cancel edit"], .mb .btn-green, .mb .btn-yellow, .mb .btn-red { position: relative; }
  .pill-tab::after, .mb-btn::after, .mb-send::after, button[aria-label="Cancel edit"]::after,
  .mb .btn-green::after, .mb .btn-yellow::after, .mb .btn-red::after {
    content: ""; position: absolute; inset: 50% auto auto 50%;
    width: 44px; height: 44px; transform: translate(-50%, -50%);
  }

  /* :focus-visible (DS rule): these three classes are not covered by the
     shared :where(...) ring in the locked block above (that ring lists
     .btn-green/.btn-yellow/.btn-red/.btn-primary/.btn-inverse/.btn-glass/
     .btn-text/.ap-edge-btn/.ap-thumb/.ap-submit/.ie-act only), so the
     ring is added here for this component's own controls. */
  .pill-tab:focus-visible, .mb-btn:focus-visible, .mb-send:focus-visible, button[aria-label="Cancel edit"]:focus-visible {
    outline: var(--focus-ring-width, 2px) solid var(--focus-ring-color, var(--brand-primary));
    outline-offset: var(--focus-ring-offset, 2px);
  }

  /* prefers-reduced-motion (DS rule): zero this component's own
     animated selectors; the locked data-ds blocks handle their own
     families via --anim-mult already, this covers the local keyframes
     that aren't wrapped by another component's reduced-motion block. */
  @media (prefers-reduced-motion: reduce) {
    .ap-item, .ap-item.is-on .ap-ic, .ap-footer, .ap-spin, .ap-check-draw path {
      animation: none !important;
    }
    .ap-item .ap-ic {
      transition: none !important;
    }
  }
</style>

<div style="min-height: 100vh; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; font-family: 'Montserrat', sans-serif; background: #FFFFFF;">

  <div style="width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 10px;">

          {{ p.label }}

    </div>

        </div>

          <span style="font-size: 13px; font-weight: 900; color: var(--fg1); letter-spacing: -0.02em; white-space: nowrap;">{{ title }}</span>
          <span style="font-size: 11px; font-weight: 600; color: var(--fg4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ kicker }}</span>
        </div>
        <span class="badge tag" style="flex-shrink: 0;">
          <span class="material-icons">check_circle</span>{{ doneCount }} / {{ totalCount }}
        </span>
      </div>

      <div style="height: 1px; background: var(--border-hairline); margin: 11px 0;"></div>

      <sc-if value="{{ isGenerating }}" hint-placeholder-val="{{ false }}">
        <div class="mb-skel" style="position: static; inset: auto; min-height: 128px; justify-content: center;">
          <div class="skel-bar w1"></div>
          <div class="skel-bar w3"></div>
          <div class="skel-bar w2"></div>
          <div class="skel-bar w1"></div>
          <div class="skel-bar w3"></div>

      </sc-if>

      <sc-if value="{{ isReady }}" hint-placeholder-val="{{ true }}">

                <sc-if value="{{ it.tag }}" hint-placeholder-val="{{ true }}">

                </sc-if>
              </div>
            </sc-for>
          </div>

          <div class="pills-row" style="gap: 6px;">
            <sc-for list="{{ tags }}" as="t" hint-placeholder-count="3">
              <span class="badge tag"><span class="material-icons">{{ t.icon }}</span>{{ t.label }}</span>

          </div>

            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <button type="button" class="mb-btn {{ editBtnCls }}" onClick="{{ toggleEdit }}" title="Edit plan">
                <span class="material-icons">edit</span>Edit
              </button>
              <button type="button" class="{{ ctaClass }}" onClick="{{ approve }}" style="min-width: 148px;">
                <sc-if value="{{ ctaIdle }}" hint-placeholder-val="{{ true }}">
                  <span style="display: inline-flex; align-items: center; gap: 7px;">
                    <span class="material-icons" style="font-size: 16px;">{{ ctaIcon }}</span>{{ ctaLabel }}
                  </span>
                </sc-if>
                <sc-if value="{{ ctaLoading }}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg class="ap-spin" width="15" height="15" viewBox="0 0 32 32" fill="none" style="display: block;">
                      <circle cx="16" cy="16" r="12" stroke="rgba(255,255,255,0.25)" stroke-width="4"></circle>
                      <circle cx="16" cy="16" r="12" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="30 90"></circle>
                    </svg>{{ ctaBusyLabel }}
                  </span>
                </sc-if>
                <sc-if value="{{ ctaDone }}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 7px;">
                    <svg class="ap-check-draw" width="16" height="16" viewBox="0 0 24 24" fill="none" style="display: block;">
                      <path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>{{ ctaDoneLabel }}
                  </span>
                </sc-if>
              </button>
            </div>
          </div>
          </sc-if>

          <sc-if value="{{ editOpen }}" hint-placeholder-val="{{ false }}">
            <div class="ap-footer" style="display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 14px; border-radius: 9999px; background: var(--bg-chip); box-shadow: var(--shadow-recessed);">
              <input class="mb-input" type="text" placeholder="What should change?" onInput="{{ onEditInput }}" onKeyDown="{{ onEditKey }}" value="{{ editValue }}" autoFocus="{{ true }}" style="min-height: 0; flex: 1; min-width: 0; padding: 0; font-size: 13px; font-weight: 600;">
              <button type="button" onClick="{{ cancelEdit }}" aria-label="Cancel edit" title="Cancel" style="width: 28px; height: 28px; flex-shrink: 0; display: grid; place-items: center; border-radius: 9999px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--fg3); cursor: pointer; transition: background calc(var(--duration-140) * var(--anim-mult,1)), transform calc(var(--duration-instant) * var(--anim-mult,1)) var(--ease-out);" style-hover="background: #F8FAFC; color: var(--fg1);" style-active="transform: scale(0.92);">
                <span class="material-icons" style="font-size: 15px;">close</span>
              </button>
              <button type="button" class="mb-send" onClick="{{ sendEdit }}" aria-label="Send change" style="width: 28px; height: 28px; flex-shrink: 0;">
                <span class="material-icons" style="font-size: 15px;">arrow_upward</span>
              </button>
            </div>
          </sc-if>

          <span class="hint" style="text-align: left;">{{ caveat }}</span>
        </div>
      </sc-if>

    </div>
  </div>
</div>

class Component extends DCLogic {
  state = { vi: 0, phase: 'ready', cta: 'idle', off: {}, editOpen: false, editValue: '', extra: {}, edited: false };

  componentDidMount() {
    if (this.props.autoGenerate) this.run(this.state.vi);
  }

  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._c); }

  run(vi) {
    clearTimeout(this._t);
    this.setState({ vi, phase: 'generating', cta: 'idle', editOpen: false, editValue: '', edited: false });
    this._t = setTimeout(() => this.setState({ phase: 'ready' }), 1500);
  }

  sendEdit() {
    const text = this.state.editValue.trim();
    if (!text) return;
    const idx = Math.min(this.state.vi, VARIANTS.length - 1);
    clearTimeout(this._t);
    this.setState({ editOpen: false, editValue: '', phase: 'generating', cta: 'idle' });
    this._t = setTimeout(() => {
      this.setState((s) => ({
        phase: 'ready',
        edited: true,
        extra: { ...s.extra, [idx]: [...(s.extra[idx] || []), text] },
      }));
    }, 1500);
  }

  approve() {
    if (this.state.cta !== 'idle') return;
    clearTimeout(this._c);
    this.setState({ cta: 'loading' });
    this._c = setTimeout(() => this.setState({ cta: 'done' }), 1400);
  }

  renderVals() {
    const idx = Math.min(this.state.vi, VARIANTS.length - 1);
    const v = VARIANTS[idx];
    const accent = this.props.accent || v.accent;
    const done = this.state.cta === 'done';

    const extra = (this.state.extra[idx] || []).map((t) => ({ text: t, tag: 'Your edit' }));
    const all = v.items.concat(extra);
    const items = all.map((it) => ({
      text: it.text,
      tag: this.props.showTags === false ? null : (it.tag || null),
      icon: 'check_circle',
    }));

    return {
      accent,
      icon: v.icon,
      title: v.title,
      kicker: v.kicker,
      summary: v.summary,
      items,
      tags: v.tags,
      caveat: v.caveat,
      totalCount: all.length,
      doneCount: all.length,
      kicker: this.state.edited ? 'Updated from your edit just now' : v.kicker,
      editOpen: this.state.editOpen,
      footerVisible: !this.state.editOpen,
      editValue: this.state.editValue,
      editBtnCls: this.state.editOpen ? 'is-active' : '',
      toggleEdit: () => this.setState((s) => ({ editOpen: !s.editOpen })),
      cancelEdit: () => this.setState({ editOpen: false, editValue: '' }),
      onEditInput: (e) => this.setState({ editValue: e.target.value }),
      onEditKey: (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.sendEdit(); }
        if (e.key === 'Escape') this.setState({ editOpen: false, editValue: '' });
      },
      sendEdit: () => this.sendEdit(),
      mbState: this.state.phase === 'generating' ? 'generating' : (done ? 'done' : ''),
      isGenerating: this.state.phase === 'generating',
      isReady: this.state.phase === 'ready',
      footerTitle: done ? v.doneTitle : v.footerTitle,
      footerSub: done ? v.doneSub : v.footerSub,
      ctaClass: v.ctaClass,
      ctaLabel: v.ctaLabel,
      ctaIcon: v.ctaIcon,
      ctaBusyLabel: v.ctaBusy,
      ctaDoneLabel: v.ctaDoneLabel,
      ctaIdle: this.state.cta === 'idle',
      ctaLoading: this.state.cta === 'loading',
      ctaDone: done,
      approve: () => this.approve(),
      regenerate: () => this.run(idx),
      pills: VARIANTS.map((x, i) => ({
        label: x.label,
        icon: x.pillIcon,
        cls: i === idx ? 'active' : '',
        select: () => { if (i !== idx) this.run(i); },
      })),
    };
  }
}
</script>
</body>
</html>
