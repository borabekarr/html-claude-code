<!-- @dsCard group="Merge - ai-chat" name="AiMessageBoxGeneral" subtitle="-> AI Message Box / AI Caveat (new AI Chat section)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/_base.css">
<link rel="stylesheet" href="../../preview/_darkmode.css">
<link rel="stylesheet" href="../../preview/_shared-feedback.css">
<link rel="stylesheet" href="../../preview/done/jsx/_ai-message-box.css">
<link rel="stylesheet" href="../../preview/done/jsx/_pills.css">
<link rel="stylesheet" href="../../preview/done/jsx/_buttons.css">
<link rel="stylesheet" href="../../preview/done/jsx/_iconography.css">
<link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script>

<style>
  body { background: #0B1220; margin: 0; }
  a { color: #34D399; }
  a:hover { color: #6EE7B7; }
  @keyframes gSpin { to { transform: rotate(360deg); } }
  @keyframes gChipIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes gBar { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .g-spin { animation: gSpin var(--duration-760) linear infinite; }
  .g-chip { animation: gChipIn var(--duration-340) var(--ease-spring-soft) both; }
  .g-shim { background-size: 200% 100%; animation: gBar 1.6s /* motion-sweep: kept, no exact tier */ linear infinite; }
  .g-send-btn { position: relative; }
  .g-send-btn::after { content: ""; position: absolute; inset: 50% auto auto 50%; width: 44px; height: 44px; transform: translate(-50%,-50%); }
  @media (prefers-reduced-motion: reduce) {
    .g-spin, .g-chip, .g-shim { animation: none; }
  }
  :focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
</style>
</helmet>

<div style="min-height: 100vh; box-sizing: border-box; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: 'Montserrat', sans-serif; background: #0B1220;">

  <div class="mb-shell" style="width: 100%; max-width: 680px; box-sizing: border-box; border-radius: 34px; padding: 7px;">
    <div class="mb" style="padding: 14px 16px 10px; border-radius: 27px;">

      <span class="g-spin" style="{{ spinStyle }}"></span>

      <textarea class="mb-input" placeholder="{{ placeholder }}" value="{{ text }}" onChange="{{ onText }}" style="box-sizing: border-box; min-height: 0; height: 72px; resize: none; font-size: 14px; line-height: 21px; display: block; padding: 2px 40px 0 2px;"></textarea>

      <div class="mb-toolbar" style="align-items: center; margin-top: 10px; gap: 10px;">
        <div class="mb-tools-left" style="flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px;">
          <button type="button" class="mb-btn g-chip" aria-label="Add attachment" style="box-sizing: border-box; height: 26px; padding: 0 8px; border-radius: 100px; flex-shrink: 0;">
            <span class="material-icons" style="font-size: 15px;">add</span>
          </button>
          <button type="button" class="mb-btn g-chip" aria-label="Mention a reference" style="box-sizing: border-box; height: 26px; padding: 0 8px; border-radius: 100px; flex-shrink: 0;">
            <span class="material-icons" style="font-size: 15px;">alternate_email</span>
          </button>
          <sc-for list="{{ controls }}" as="c" hint-placeholder-count="3">
            <button type="button" class="mb-btn g-chip" onClick="{{ c.onCycle }}" style="{{ c.style }}">
              <span class="material-icons" style="font-size: 14px;">{{ c.icon }}</span>{{ c.value }}
              <span class="material-icons" style="font-size: 14px; opacity: .55;">expand_more</span>
            </button>
          </sc-for>
        </div>

        <div class="mb-tools-right" style="gap: 6px;">
          <button type="button" class="btn-primary g-send-btn" onClick="{{ onSend }}" style="height: 32px; padding: 0 7px 0 14px; border-radius: 100px; font-size: 12px; gap: 8px; flex-shrink: 0; filter: none; background-size: 14px 14px;">
            <span class="material-icons btn-mi" style="font-size: 15px;">{{ ctaIcon }}</span>
            {{ ctaLabel }}
            <span class="badge" style="box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 100px; background: rgba(255,255,255,0.22); color: #fff; font-size: 10px;">
              <span class="material-icons" style="font-size: 12px;">toll</span>{{ credits }}
            </span>
          </button>
        </div>
      </div>

      <div style="{{ shimWrapStyle }}">
        <div class="g-shim" style="height: 100%; background-image: linear-gradient(90deg, rgba(16,185,129,0) 0%, var(--brand-primary-300) 50%, rgba(16,185,129,0) 100%);"></div>
      </div>
    </div>
  </div>

  <span class="hint" style="width: 100%; max-width: 680px;">{{ hint }}</span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ask anything, or describe what you want to make…&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Send&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;credits&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:476,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;}}">
const CONTROLS = [
  { icon: 'bar_chart', options: ['Bora V4 Flash', 'Bora V4 Pro', 'Bora LLM 4'] },
  { icon: 'tune', options: ['Ask', 'Agent', 'Research'] },
  { icon: 'diamond', options: ['Standard', 'High', 'Ultra'] }
];

class Component extends DCLogic {
  state = { text: '', phase: 'idle', picks: {} };

  componentDidMount() { document.documentElement.classList.add('dark'); }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }

  cycle = (i, len) => () => this.setState(s => ({ picks: { ...s.picks, [i]: ((s.picks[i] ?? 0) + 1) % len } }));

  onSend = () => {
    if (this.state.phase === 'busy') return;
    this.setState({ phase: 'busy' });
    this.t1 = setTimeout(() => {
      this.setState({ phase: 'done' });
      this.t2 = setTimeout(() => this.setState({ phase: 'idle' }), 1800);
    }, 2000);
  };

  renderVals() {
    const s = this.state;
    const busy = s.phase === 'busy';
    const done = s.phase === 'done';
    return {
      placeholder: this.props.placeholder ?? 'Ask anything, or describe what you want to make…',
      text: s.text,
      onText: e => this.setState({ text: e.target.value }),
      credits: this.props.credits ?? 476,
      ctaLabel: busy ? 'Working' : (done ? 'Sent' : (this.props.ctaLabel ?? 'Send')),
      ctaIcon: done ? 'check' : 'auto_awesome',
      onSend: this.onSend,
      controls: CONTROLS.map((c, i) => ({
        icon: c.icon,
        value: c.options[s.picks[i] ?? 0],
        style: { animationDelay: (50 + i * 50) + 'ms', boxSizing: 'border-box', height: 26, padding: '0 6px 0 10px', borderRadius: 100, fontSize: 11, gap: 4, whiteSpace: 'nowrap', flexShrink: 0 },
        onCycle: this.cycle(i, c.options.length)
      })),
      spinStyle: { position: 'absolute', top: 16, right: 16, width: 18, height: 18, borderRadius: 9999, border: '2.5px solid rgba(148,163,184,0.22)', borderTopColor: 'var(--brand-primary)', zIndex: 3, opacity: busy ? 1 : 0, transition: 'opacity var(--duration-240) var(--ease-standard)' },
      shimWrapStyle: { position: 'absolute', left: 16, right: 16, bottom: 4, height: 3, borderRadius: 9999, overflow: 'hidden', opacity: busy ? 1 : 0, transition: 'opacity var(--duration-240) var(--ease-standard)' },
      hint: busy ? 'Working — you can keep editing the prompt' : 'Tap a chip to switch model, mode or quality'
    };
  }
}

</script>
</body>
</html>
