<style>
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Montserrat', system-ui, sans-serif;
    background: #0B1220;
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(16,185,129,0.16) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 10% 110%, rgba(59,130,246,0.10) 0%, transparent 60%);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---- hide scrollbars on the article scroller ---- */
  .di-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .di-scroll { scrollbar-width: none; -ms-overflow-style: none; }

  /* =====================================================================
     DYNAMIC ISLAND — motion system
     All transforms/opacity only (GPU-friendly). The pill itself morphs
     via a width/height/border-radius transition on .di-pill (260ms spring).
     ===================================================================== */

  /* The morph transition for the pill silhouette.
     cubic-bezier below is a gentle overshoot ("spring-ish") ease. */
  .di-pill {
    transition:
      width   320ms cubic-bezier(.34,1.32,.5,1),
      height  320ms cubic-bezier(.34,1.32,.5,1),
      border-radius 320ms cubic-bezier(.34,1.32,.5,1),
      box-shadow 320ms ease,
      background 220ms ease;
    will-change: width, height;
  }
  @media (prefers-reduced-motion: reduce) {
    .di-pill { transition: width 120ms linear, height 120ms linear, border-radius 120ms linear; }
  }

  /* Content cross-fade inside the pill (compact ⇄ expanded) */
  .di-face {
    transition: opacity 180ms ease, transform 220ms cubic-bezier(.34,1.2,.5,1);
  }

  /* Milestone pulse — brief scale bump on the whole pill (applied to inner) */
  @keyframes diPulse {
    0%   { transform: scale(1); }
    38%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .di-pulse { animation: diPulse 460ms cubic-bezier(.22,1,.36,1); }

  /* Fill milestone glow */
  @keyframes diFillGlow {
    0%   { filter: brightness(1)   saturate(1); }
    40%  { filter: brightness(1.28) saturate(1.25); }
    100% { filter: brightness(1)   saturate(1); }
  }
  .di-fill-glow { animation: diFillGlow 560ms ease; }

  /* Moving shine — sweeps within the green fill only (parent clips it) */
  @keyframes diShine {
    0%   { left: -30%; }
    100% { left: 115%; }
  }

  /* Completion check badge pop */
  @keyframes diCheckPop {
    0%   { transform: scale(0.2); opacity: 0; }
    55%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .di-check-pop { animation: diCheckPop 420ms cubic-bezier(.34,1.4,.5,1) both; }
  @keyframes diCheckDraw {
    to { stroke-dashoffset: 0; }
  }

  /* Confetti particles */
  @keyframes diConfetti {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(var(--rot)); opacity: 0; }
  }
  .di-confetti-piece {
    position: absolute; top: 50%; left: 50%;
    width: 6px; height: 6px; border-radius: 2px;
    animation: diConfetti 760ms cubic-bezier(.2,.7,.3,1) forwards;
  }

  /* Pill entrance (slide+fade from the notch when first appearing) */
  @keyframes diDrop {
    0%   { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.9); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .di-pulse, .di-fill-glow, .di-confetti-piece, .di-check-pop { animation: none !important; }
  }

  /* compact ring spin (subtle) — none; ring is static arc */
  .di-tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
</style>
