<!-- @dsCard group="Merge - pills-chips-badges" name="pages__CitationChip" subtitle="-> Pills, chips & badges" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="../../colors_and_type.css"><link rel="stylesheet" href="../../preview/_motion-tokens.css">
<link rel="stylesheet" href="../../preview/done/jsx/_pills.css">
<link rel="stylesheet" href="../../preview/done/jsx/_ai-message-box.css">
<style>
@keyframes icPop { from { opacity:0; transform: translateY(-6px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes icChipIn { from { opacity:0; transform: translateY(3px) scale(.8); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes icRing { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.35); } 100% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; /* motion-sweep: kept */ animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; /* motion-sweep: kept */ }
}
</style>
<link rel="stylesheet" href="../../styles.css"></helmet>
<span onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position:relative; display:inline-block; vertical-align:-0.28em; z-index:{{ z }}; font-family:'Montserrat',sans-serif; font-size:0; line-height:normal;">
  <sc-if value="{{ isChip }}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{ toggle }}" style="position:relative; display:inline-flex; align-items:center; gap:4px; padding:0 7px 0 4px; margin:0 4px; border-radius:9999px; border:1px solid #A7F3D0; background:#ECFDF5; color:#047857; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:800; line-height:16px; cursor:pointer; animation:icChipIn var(--duration-320) var(--ease-bounce-soft) both; transition:background var(--duration-base) var(--ease-standard), border-color var(--duration-base) var(--ease-standard), transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-200) var(--ease-standard);" style-hover="background:#D1FAE5; border-color:#6EE7B7;" style-focus="outline:var(--focus-ring-width) solid var(--focus-ring-color); outline-offset:var(--focus-ring-offset);" style-after="content:''; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%);">
      <span style="display:inline-grid; place-items:center; width:13px; height:13px; border-radius:9999px; background:#10B981; color:#fff; font-size:8.5px; font-weight:900; line-height:1;">{{ n }}</span>
      <span>{{ label }}</span>
    </button>
  </sc-if>
  <sc-if value="{{ isStack }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ toggle }}" style="position:relative; display:inline-flex; align-items:center; gap:6px; padding:1px 8px 1px 4px; margin:0 4px; border-radius:9999px; border:1px solid #CBD5E1; background:#fff; cursor:pointer; box-shadow:inset 0 -2px 5px rgba(0,0,0,0.07); transition:background var(--duration-base) var(--ease-standard), transform var(--duration-fast) var(--ease-out);" style-hover="background:#F8FAFC;" style-focus="outline:var(--focus-ring-width) solid var(--focus-ring-color); outline-offset:var(--focus-ring-offset);" style-after="content:''; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%);">
      <span style="display:inline-flex;">
        <sc-for list="{{ stackItems }}" as="s" hint-placeholder-count="3">
          <span style="display:inline-grid; place-items:center; width:17px; height:17px; margin-left:-5px; border-radius:9999px; border:1.5px solid #fff; background:#0F172A; color:#fff; font-size:8px; font-weight:900;">{{ s.initial }}</span>
        </sc-for>
      </span>
      <span style="font-size:11px; font-weight:800; color:#334155;">{{ count }} sources</span>
    </button>
  </sc-if>
  <sc-if value="{{ isUnverified }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ toggle }}" style="position:relative; display:inline-flex; align-items:center; gap:4px; padding:0 8px 0 5px; margin:0 4px; border-radius:9999px; border:1px dashed #FDE68A; background:#FEFCE8; color:#A16207; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:800; line-height:16px; cursor:pointer; transition:background var(--duration-base) var(--ease-standard);" style-hover="background:#FEF9C3;" style-focus="outline:var(--focus-ring-width) solid var(--focus-ring-color); outline-offset:var(--focus-ring-offset);" style-after="content:''; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%);">
      <span class="material-icons" style="font-size:12px;">help_outline</span>
      <span>unverified</span>
    </button>
  </sc-if>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <span style="position:absolute; z-index:60; top:100%; left:0; width:340px; display:block; box-sizing:border-box; padding-top:12px; font-size:13px; line-height:normal; white-space:normal; transform-origin:top left; animation:icPop var(--duration-280) var(--ease-out) both; text-align:left;">
      <span style="display:block; box-sizing:border-box; width:100%; background:#D4DCE8; border-radius:26px; padding:6px; box-shadow:0 18px 40px -12px rgba(15,23,42,.35);"><span style="display:block; box-sizing:border-box; width:100%; background:#fff; border:1px solid #CBD5E1; border-top-color:rgba(255,255,255,.9); border-radius:20px; box-shadow:inset 0 1px 0 rgba(255,255,255,1); overflow:hidden;">
        <span style="display:block; overflow:hidden;">
          <span style="display:flex; transition:transform var(--duration-380) var(--ease-out); transform: translateX({{ tx }});">
            <sc-for list="{{ cards }}" as="c" hint-placeholder-count="1">
              <span style="flex:0 0 100%; width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:9px; padding:14px 14px 12px;">
                <span style="display:flex; align-items:center; gap:8px;">
                  <span style="display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; background:#0F172A; color:#fff; font-size:11px; font-weight:900;">{{ c.initial }}</span>
                  <span style="font-size:12px; font-weight:800; color:#0F172A;">{{ c.site }}</span>
                  <span class="badge tag" style="margin-left:auto;">{{ c.tag }}</span>
                </span>
                <span style="display:block; font-size:14px; font-weight:800; color:#0F172A; line-height:1.3; text-wrap:pretty;">{{ c.title }}</span>
                <span style="display:block; border-left:2px solid #10B981; padding-left:10px; font-size:12.5px; font-weight:500; color:#475569; line-height:1.55; text-wrap:pretty;">{{ c.quote }}</span>
                <span style="display:flex; align-items:center; gap:8px; margin-top:2px;">
                  <span style="font-size:11px; font-weight:600; color:#94A3B8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ c.url }}</span>
                  <button type="button" class="mb-btn" style="margin-left:auto; padding:5px 11px; font-size:11.5px;">
                    <span class="material-icons" style="font-size:14px;">open_in_new</span>Open
                  </button>
                </span>
              </span>
            </sc-for>
          </span>
        </span>
        <span style="display:flex; align-items:center; gap:9px; padding:10px 12px; border-top:1px solid #E2E8F0; background:#F8FAFC;">
          <button type="button" onClick="{{ prev }}" style="position:relative; display:grid; place-items:center; width:28px; height:28px; line-height:0; padding:0; border-radius:9999px; border:1px solid #CBD5E1; background:#fff; color:#475569; cursor:pointer; transition:background var(--duration-140) var(--ease-standard), transform var(--duration-fast) var(--ease-press-calm);" style-hover="background:#F1F5F9;" style-active="transform:scale(.9);" style-focus="outline:var(--focus-ring-width) solid var(--focus-ring-color); outline-offset:var(--focus-ring-offset);" style-after="content:''; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%);">
            <span class="material-icons" style="font-size:16px; line-height:1; display:block;">chevron_left</span>
          </button>
          <button type="button" onClick="{{ next }}" style="position:relative; display:grid; place-items:center; width:28px; height:28px; line-height:0; padding:0; border-radius:9999px; border:1px solid #CBD5E1; background:#fff; color:#475569; cursor:pointer; transition:background var(--duration-140) var(--ease-standard), transform var(--duration-fast) var(--ease-press-calm);" style-hover="background:#F1F5F9;" style-active="transform:scale(.9);" style-focus="outline:var(--focus-ring-width) solid var(--focus-ring-color); outline-offset:var(--focus-ring-offset);" style-after="content:''; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%);">
            <span class="material-icons" style="font-size:16px; line-height:1; display:block;">chevron_right</span>
          </button>
          <span style="display:flex; align-items:center; gap:5px; margin-left:4px;">
            <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
              <button type="button" onClick="{{ d.on }}" style="position:relative; height:6px; width:{{ d.w }}; padding:0; border:none; border-radius:9999px; background:{{ d.bg }}; cursor:pointer; transition:width var(--duration-260) var(--ease-bounce-soft), background var(--duration-200) var(--ease-standard);" style-focus="outline:var(--focus-ring-width) solid var(--focus-ring-color); outline-offset:var(--focus-ring-offset);" style-after="content:''; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%);"></button>
            </sc-for>
          </span>
          <span style="margin-left:auto; font-size:11px; font-weight:800; color:#64748B; font-variant-numeric:tabular-nums;">{{ pos }}</span>
          <button type="button" onClick="{{ close }}" style="position:relative; display:grid; place-items:center; width:28px; height:28px; line-height:0; padding:0; border-radius:9999px; border:none; background:transparent; color:#94A3B8; cursor:pointer; transition:color var(--duration-140) var(--ease-standard), transform var(--duration-fast) var(--ease-press-calm);" style-hover="color:#0F172A;" style-active="transform:scale(.9);" style-focus="outline:var(--focus-ring-width) solid var(--focus-ring-color); outline-offset:var(--focus-ring-offset);" style-after="content:''; position:absolute; inset:50% auto auto 50%; width:44px; height:44px; transform:translate(-50%,-50%);">
            <span class="material-icons" style="font-size:17px; line-height:1; display:block;">close</span>
          </button>
        </span>
      </span>
      </span>
    </span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:420},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chip&quot;,&quot;stack&quot;,&quot;unverified&quot;],&quot;default&quot;:&quot;chip&quot;,&quot;tsType&quot;:&quot;'chip'|'stack'|'unverified'&quot;},&quot;n&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;reuters.com&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sources&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{site:string,title:string,quote:string,url:string,tag:string}&gt;&quot;}}">
class Component extends DCLogic {
  state = { open: false, idx: 0 };
  componentDidMount() {
    this._id = Math.random().toString(36).slice(2);
    this._onOther = (e) => { if (e.detail !== this._id) this._close(); };
    this._onKey = (e) => { if (e.key === 'Escape') this._close(); };
    window.addEventListener('citation-open', this._onOther);
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('citation-open', this._onOther);
    window.removeEventListener('keydown', this._onKey);
    clearTimeout(this._t);
  }
  _close() { clearTimeout(this._t); if (this.state.open) this.setState({ open: false, pinned: false }); }
  _open() {
    clearTimeout(this._t);
    window.dispatchEvent(new CustomEvent('citation-open', { detail: this._id }));
    if (!this.state.open) this.setState({ open: true });
  }
  _leave() {
    clearTimeout(this._t);
    if (this.state.pinned) return;
    this._t = setTimeout(() => this.setState({ open: false }), 90);
  }
  renderVals() {
    const mode = this.props.mode || 'chip';
    const srcs = (this.props.sources && this.props.sources.length ? this.props.sources : [
      { site: 'reuters.com', title: 'Untitled source', quote: '', url: 'https://reuters.com', tag: 'web' }
    ]).map(s => Object.assign({ initial: (s.site || '?')[0].toUpperCase() }, s));
    const idx = Math.min(this.state.idx, srcs.length - 1);
    return {
      n: this.props.n ?? 1,
      label: this.props.label ?? srcs[idx].site,
      isChip: mode === 'chip',
      isStack: mode === 'stack',
      isUnverified: mode === 'unverified',
      open: !!this.state.open,
      cards: srcs,
      stackItems: srcs.slice(0, 3),
      count: srcs.length,
      pos: (idx + 1) + ' / ' + srcs.length,
      tx: '-' + (idx * 100) + '%',
      dots: srcs.map((s, i) => ({
        bg: i === idx ? '#10B981' : '#CBD5E1',
        w: i === idx ? '18px' : '6px',
        on: () => this.setState({ idx: i })
      })),
      z: this.state.open ? 90 : 1,
      enter: () => this._open(),
      leave: () => this._leave(),
      toggle: () => {
        if (this.state.open && this.state.pinned) { this._close(); }
        else { this._open(); this.setState({ pinned: true }); }
      },
      close: () => this._close(),
      prev: () => this.setState(s => ({ idx: (s.idx - 1 + srcs.length) % srcs.length })),
      next: () => this.setState(s => ({ idx: (s.idx + 1) % srcs.length }))
    };
  }
}
</script>
</body>
</html>
