<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif; }
  body, button, input, select, textarea { font-family: 'Montserrat', system-ui, sans-serif; }
  h1, h2, h3, h4 { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 900; }
  .material-icons { font-family: 'Material Icons'; }
  .material-symbols-outlined, .ms { font-family: 'Material Symbols Outlined'; }
  a { color: #059669; text-decoration: none; }
  a:hover { color: #047857; text-decoration: underline; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; line-height: 1; }
</style>
<link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script></helmet>

<style>
  /* contextmenu-v2 component-region rules (plan: claude-design-frontend-pass Step 11).
     Static showcase render -- no trigger element and no open/close JS exist in this
     export, so "Escape closes" and "transform-origin anchored to trigger" / exit-tier
     asymmetry do not apply (recorded Not applicable in token-map.md); role="menu"/
     "menuitem", :focus-visible and hit layers still apply to the always-visible rows. */
  .cm-wrap { padding: var(--space-10) var(--space-12) 64px; display: flex; flex-direction: column; gap: var(--space-6); color: #0F172A; }
  .cm-eyebrow { font-size: var(--type-mini); font-weight: var(--weight-bold); letter-spacing: 0.12em; text-transform: uppercase; color: #94A3B8; }
  .cm-title { margin: 0; font-size: var(--type-h1); font-weight: var(--weight-black); letter-spacing: -0.02em; }
  .cm-sub { margin: 0; font-size: var(--type-body-sm); font-weight: var(--weight-medium); color: #64748B; }
  .cm-row-wrap { display: flex; gap: var(--space-8); align-items: flex-start; flex-wrap: wrap; }
  .cm-menu { box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: var(--radius-lg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -1px rgba(0,0,0,0.06); }
  .cm-menu--compact { width: 280px; padding: var(--space-2); display: flex; flex-direction: column; gap: 2px; }
  .cm-menu--sectioned { width: 238px; padding: var(--space-3) 0; display: flex; flex-direction: column; }
  .cm-item { position: relative; box-sizing: border-box; height: 38px; padding: 0 var(--space-3); display: flex; align-items: center; gap: var(--space-3); border-radius: var(--radius-xs); font-size: var(--type-body-sm); font-weight: var(--weight-semibold); color: #0F172A; cursor: pointer; }
  .cm-menu--sectioned .cm-item { height: 34px; padding: 0 14px; gap: 10px; border-radius: 0; }
  .cm-item--danger { font-weight: var(--weight-bold); color: var(--semantic-danger); }
  .cm-item .ms { font-size: 19px; color: #64748B; }
  .cm-menu--sectioned .cm-item .ms { font-size: 18px; }
  .cm-item--danger .ms { color: var(--semantic-danger); }
  .cm-item-trail { margin-left: auto; }
  .cm-item-chevron { margin-left: auto; font-size: 18px; color: #CBD5E1; }
  .cm-sep { height: 1px; background: #E2E8F0; margin: 6px 4px; }
  .cm-menu--sectioned .cm-sep { margin: var(--space-2) 0; }
  .cm-section-label { padding: 6px 14px; font-size: var(--type-mini); font-weight: var(--weight-bold); text-transform: uppercase; letter-spacing: 0.12em; color: #94A3B8; }
  .cm-dot { width: 8px; height: 8px; border-radius: var(--radius-circle); background: #64748B; flex: none; }
  .cm-dot--hot { background: var(--semantic-hot); }
  .cm-dot--won { background: var(--brand-primary); }
  /* 44px hit layers: every row is visually < 44px tall */
  .cm-item::after { content: ""; position: absolute; inset: 50% auto auto 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
  .cm-item:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .cm-item:hover { background: #F1F5F9; transition: background-color var(--duration-base) var(--ease-standard); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cm-item { transition: none; }
  }
</style>
<div class="cm-wrap">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div class="cm-eyebrow">Bora · Overlays</div>
    <h1 class="cm-title">ContextMenu</h1>
    <p class="cm-sub">Right-click and overflow menu. Compact and sectioned variants.</p>
  </div>

  <div class="cm-row-wrap">
    <div class="cm-menu cm-menu--compact" role="menu" aria-label="Lead context menu">
      <div class="cm-item" role="menuitem" tabindex="0"><span class="ms" aria-hidden="true">edit</span>Edit lead</div>
      <div class="cm-item" role="menuitem" tabindex="0" style="background: #F1F5F9;"><span class="ms" aria-hidden="true">content_copy</span>Duplicate</div>
      <div class="cm-item" role="menuitem" tabindex="0"><span class="ms" aria-hidden="true">bookmark</span>Add to watchlist<span class="badge success cm-item-trail">New</span></div>
      <div class="cm-sep" role="separator"></div>
      <div class="cm-item cm-item--danger" role="menuitem" tabindex="0"><span class="ms" aria-hidden="true">delete</span>Delete</div>
    </div>

    <div class="cm-menu cm-menu--sectioned" role="menu" aria-label="Lead overflow menu">
      <div class="cm-section-label">Lead</div>
      <div class="cm-item" role="menuitem" tabindex="0"><span class="ms" aria-hidden="true">visibility</span>Open</div>
      <div class="cm-item" role="menuitem" tabindex="0" style="background: #F1F5F9;"><span class="ms" aria-hidden="true">edit</span>Edit</div>
      <div class="cm-sep" role="separator"></div>
      <div class="cm-section-label">Move to</div>
      <div class="cm-item" role="menuitem" tabindex="0"><span class="cm-dot" aria-hidden="true"></span>Discovery</div>
      <div class="cm-item" role="menuitem" tabindex="0"><span class="cm-dot cm-dot--hot" aria-hidden="true"></span>Proposal</div>
      <div class="cm-item" role="menuitem" tabindex="0"><span class="cm-dot cm-dot--won" aria-hidden="true"></span>Closed won</div>
      <div class="cm-sep" role="separator"></div>
      <div class="cm-item" role="menuitem" tabindex="0"><span class="ms" aria-hidden="true">person_add</span>Assign<span class="ms cm-item-chevron" aria-hidden="true">chevron_right</span></div>
      <div class="cm-item cm-item--danger" role="menuitem" tabindex="0"><span class="ms" aria-hidden="true">delete</span>Delete</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
